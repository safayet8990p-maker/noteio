plugins {
    id 'com.android.application'
}

android {
    namespace 'com.notebook.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.notebook.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("notebook-release.jks")
            storePassword "notebook123"
            keyAlias "notebook"
            keyPassword "notebook123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
