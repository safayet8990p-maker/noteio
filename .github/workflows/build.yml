name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0). Leave empty to only build.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android project
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$f" ]; then
            echo "settings.gradle not found in the repository. Files present:"
            find . -not -path './.git/*' -type f | head -50
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$f")" >> "$GITHUB_ENV"

      - name: Decide version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VER=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_VERSION" ]]; then
            VER="${INPUT_VERSION#v}"
          fi
          if [[ -n "$VER" && ! "$VER" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid version: $VER"; exit 1
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "Version: ${VER:-<none, build only>}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply version to app
        if: env.VERSION != ''
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" app/build.gradle

      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: |
          NAME="Notebook-dev.apk"
          if [[ -n "$VERSION" ]]; then NAME="Notebook-v$VERSION.apk"; fi
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "$NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Notebook-apk
          path: Notebook-*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: env.VERSION != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Notebook v${{ env.VERSION }}
          files: Notebook-*.apk
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
